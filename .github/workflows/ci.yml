name: CI

on:
  push:
    branches:
      - master
    paths:
      - 'compose.yml'
      - 'Dockerfile'
      - 'guard_core_mcp/**'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'scripts/**'
      - 'tests/**'
  pull_request_target:
    branches:
      - master
    paths:
      - 'compose.yml'
      - 'Dockerfile'
      - 'guard_core_mcp/**'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: pip install uv
      - run: uv sync --extra dev
      - run: uv run pre-commit run --all-files

  test:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Send Initial Slack Message
        id: send_initial_slack_ci
        uses: rennf93/good-comms@master
        with:
          SLACK_WEBHOOK: '${{ secrets.SLACK_WEBHOOK }}'
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          STATUS: 'Started'
          CHANNEL_ID: '${{ secrets.SLACK_CHANNEL }}'
          AUTHOR_NAME: 'Guard Core MCP - CI & Tests - Py${{ matrix.python-version }}'
          AUTHOR_LINK: 'https://github.com/rennf93/guard-core-mcp'
          AUTHOR_ICON: ':test_tube:'
          TITLE: 'CI & Tests Started - Py${{ matrix.python-version }}'
          TITLE_LINK: 'https://github.com/rennf93/guard-core-mcp/actions'
          MESSAGE: |
            .
            *CI & TESTS TRIGGERED!*

            .
            Matrix:
              Python: ${{ matrix.python-version }}

            Docs version:
              ${{ secrets.DOCS_VERSION }}

            Commit:
              ${{ github.event.head_commit.message }}
            .
          COLOR: warning

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Run tests
        run: |
          uv run pytest -v --cov=guard_core_mcp --cov-branch

      - name: Notify Success on Slack Channel
        uses: rennf93/good-comms@master
        with:
          SLACK_WEBHOOK: '${{ secrets.SLACK_WEBHOOK }}'
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          STATUS: 'Success'
          CHANNEL_ID: '${{ secrets.SLACK_CHANNEL }}'
          AUTHOR_NAME: 'Guard Core MCP - CI & Tests - Py${{ matrix.python-version }}'
          AUTHOR_LINK: 'https://github.com/rennf93/guard-core-mcp'
          AUTHOR_ICON: ':gem:'
          TITLE: 'CI & Tests Successful - Py${{ matrix.python-version }}'
          TITLE_LINK: 'https://github.com/rennf93/guard-core-mcp/actions'
          MESSAGE: |
            .
            Matrix:
              Python: ${{ matrix.python-version }}

            Docs version:
              ${{ secrets.DOCS_VERSION }}

            Commit message:
              ${{ github.event.head_commit.message }}

            Commit URL:
              ${{ github.event.head_commit.url }}
            .
          COLOR: good
          SLACK_THREAD_TS: ${{ steps.send_initial_slack_ci.outputs.SLACK_THREAD_TS }}

      - name: Send Failure Notification to Slack
        if: failure()
        uses: rennf93/good-comms@master
        with:
          SLACK_WEBHOOK: '${{ secrets.SLACK_WEBHOOK }}'
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          STATUS: 'Failed'
          CHANNEL_ID: '${{ secrets.SLACK_CHANNEL }}'
          AUTHOR_NAME: 'Guard Core MCP - CI & Tests - Py${{ matrix.python-version }}'
          AUTHOR_LINK: 'https://github.com/rennf93/guard-core-mcp'
          AUTHOR_ICON: ':skull:'
          TITLE: 'CI & Tests Failed - Py${{ matrix.python-version }}'
          TITLE_LINK: 'https://github.com/rennf93/guard-core-mcp/actions'
          MESSAGE: |
            .
            Matrix:
              Python: ${{ matrix.python-version }}

            Docs version:
              ${{ secrets.DOCS_VERSION }}

            CI & Tests failed for commit:
              ${{ github.event.head_commit.message }}

            Commit URL:
              ${{ github.event.head_commit.url }}

            Please check the logs for more details.
            .
          COLOR: danger
          SLACK_THREAD_TS: ${{ steps.send_initial_slack_ci.outputs.SLACK_THREAD_TS }}

  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: pip install uv
      - name: Check vendored docs are current
        run: |
          git clone --depth 1 https://github.com/rennf93/fastapi-guard ../fastapi-guard
          git clone --depth 1 https://github.com/rennf93/guard-core ../guard-core
          git clone --depth 1 https://github.com/rennf93/guard-agent ../guard-agent
          uv run python scripts/sync_docs.py
          DRIFT=$(git status --porcelain guard_core_mcp/_docs)
          if [ -n "$DRIFT" ]; then
            echo "$DRIFT"
            echo "::error::guard_core_mcp/_docs is stale against the upstream repos — rerun scripts/sync_docs.py and commit the result"
            exit 1
          fi
